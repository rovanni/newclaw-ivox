[project]
name = "newclaw-ivox"
version = "0.1.0"
description = "Interface de voz opcional para o NewClaw (harness): ouve, mostra e fala, sem modelo próprio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# A base (configuração, frases, protocolo, diagnóstico) usa só a biblioteca padrão.
dependencies = []

[project.optional-dependencies]
# Motor de voz. Versão fixada na da Etapa 0 (ADR-030), auditada no Windows na Sprint 2: docs/terceiros/windows.md.
# Versões exatas de todo o ambiente auditado: requisitos-motor-windows.txt.
motor = ["pipecat-ai[webrtc,silero,openai,runner]==1.12.0"]
# Transcrição nesta máquina (faster-whisper), ADR-030, revisão de 29/10/2026.
stt-local = ["pipecat-ai[whisper]==1.12.0"]
# Bibliotecas CUDA da NVIDIA pelo pip; o instalador só pede este extra quando mede uma GPU NVIDIA (fora do macOS).
cuda = ["nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12==9.27.0.42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newclaw_ivox"]
