[project]
name = "newclaw-ivox"
version = "0.1.0"
description = "Interface de voz opcional para o NewClaw (harness): ouve, mostra e fala, sem modelo próprio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# A base (configuração, frases, protocolo, diagnóstico) usa só a biblioteca padrão.
dependencies = []

[project.optional-dependencies]
# Motor de voz. Versão fixada na da Etapa 0 (ADR-030), auditada no Windows na Sprint 2: docs/terceiros/windows.md.
# Versões exatas de todo o ambiente auditado: requisitos-motor-windows.txt.
motor = ["pipecat-ai[webrtc,silero,openai,runner]==1.12.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newclaw_ivox"]
